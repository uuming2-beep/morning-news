name: Update morning newsletter
on:
  schedule:
    - cron: '10 23 * * *' # 08:10 Asia/Seoul, next calendar day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate newsletter
        run: python morning_news_auto/build.py
      - name: Publish newsletter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morning_news_auto/docs
          if ! git diff --cached --quiet; then
            git commit -m "Update morning newsletter"
            git push
          fi
